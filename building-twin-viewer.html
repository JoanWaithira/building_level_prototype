<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bram House — Building Digital Twin (MVP)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #0d0f15; }
    .panel {
      position: absolute; top: 10px; background: rgba(20, 24, 34, 0.88); color: #e8eaf0;
      border-radius: 10px; padding: 12px 14px; font-size: 13px; max-height: calc(100vh - 40px);
      overflow-y: auto; backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.4); z-index: 5;
    }
    #propPanel { left: 10px; width: 320px; display: none; }
    #sensorPanel { right: 10px; width: 260px; }
    .panel h3 { margin: 0 0 8px 0; font-size: 14px; color: #7ec8ff; }
    .panel h4 { margin: 10px 0 4px 0; font-size: 12px; color: #9aa4b8; text-transform: uppercase; letter-spacing: .5px; }
    table.props { width: 100%; border-collapse: collapse; }
    table.props td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,.08); vertical-align: top; word-break: break-word; }
    table.props td:first-child { color: #9aa4b8; width: 42%; }
    .zone { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
    .zone .zname { font-weight: 600; margin-bottom: 4px; }
    .metric { display: flex; justify-content: space-between; margin: 2px 0; }
    .metric .val { font-variant-numeric: tabular-nums; font-weight: 600; }
    .ok { color: #7ee29a; } .warn { color: #ffcf5e; } .bad { color: #ff7e7e; }
    .closeBtn { float: right; cursor: pointer; color: #9aa4b8; margin-left: 8px; }
    .badge { display:inline-block; background:#2a3550; color:#7ec8ff; border-radius:4px; padding:1px 6px; font-size:11px; margin-left:6px;}
    /* Diagnostics overlay */
    #diag {
      position: absolute; bottom: 10px; left: 10px; z-index: 20; width: 460px; max-width: calc(100vw - 20px);
      background: rgba(10, 12, 18, 0.92); color: #cfd6e4; border-radius: 8px; font-size: 12px;
      font-family: Consolas, monospace; padding: 8px 10px; max-height: 40vh; overflow-y: auto;
      box-shadow: 0 4px 18px rgba(0,0,0,.5);
    }
    #diag div { padding: 1px 0; }
    #diag .d-ok { color: #7ee29a; } #diag .d-err { color: #ff7e7e; font-weight: 700; } #diag .d-info { color: #9aa4b8; }
    #diagToggle { position: absolute; bottom: 10px; left: 10px; z-index: 21; display: none;
      background:#2a3550; color:#7ec8ff; border:none; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px;}
  </style>
</head>
<body>
<div id="cesiumContainer"></div>

<div id="diag"><div class="d-info">▶ Diagnostics (auto-hides when all OK) — <span style="cursor:pointer;text-decoration:underline" onclick="hideDiag()">hide</span></div></div>
<button id="diagToggle" onclick="showDiag()">Show diagnostics</button>

<div id="propPanel" class="panel">
  <span class="closeBtn" onclick="document.getElementById('propPanel').style.display='none'">✕</span>
  <h3>Element properties</h3>
  <div id="propContent">Click a building element…</div>
</div>

<div id="sensorPanel" class="panel">
  <h3>Live zone data <span class="badge">simulated</span></h3>
  <div id="zones"></div>
</div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  ionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJlNDgxNjNjYS1kMTY1LTRhOTQtODFiZC1mYWMyNzY4OWVjN2YiLCJpZCI6MzQzOTQwLCJpYXQiOjE3NTg2MzQ0MTR9.pQiAchoUyxCsz38HgMWMnBs4ua7xTKPcbTE2s5EnbK4",
  assetId: 5041854,        // Bram House (Without Site Floor) — tiled on Cesium ion

  // Georeference: IfcSite (52.38026, 6.62700) ≈ BAG pand 0141100000019888,
  // Kerkweg 18, 7611BA Aadorp (footprint centre 52.38017, 6.62708)
  lat: 52.3802567,
  lon: 6.6269965,

  // ion reported "this tileset doesn't have a location" → we place it ourselves.
  // Auto-skipped if the tileset is already within 5 km of the site (e.g. after
  // using "Adjust Tileset Location" on ion — then this must stay off).
  placeAtSite: true,
  headingDegrees: 0,       // rotate building around vertical axis (0 = north)
  heightOffset: 0,         // meters up(+)/down(-) relative to sampled terrain
  useWorldTerrain: true,   // false → flat ellipsoid (works without ion)

  storeys: [
    { name: "Level 0", h: 0 },
    { name: "Level 1", h: 3 },
    { name: "Level 2", h: 6 },
    { name: "Roof",    h: 9 },
  ],
};
/* ========================================== */

/* ---------- Diagnostics ---------- */
const diagEl = document.getElementById("diag");
let diagErrors = 0;
function log(msg, cls) {
  const d = document.createElement("div");
  d.className = cls || "d-info";
  d.textContent = (cls === "d-err" ? "✖ " : cls === "d-ok" ? "✔ " : "· ") + msg;
  diagEl.appendChild(d);
  if (cls === "d-err") diagErrors++;
  console.log("[diag]", msg);
}
function hideDiag(){ diagEl.style.display="none"; document.getElementById("diagToggle").style.display="block"; }
function showDiag(){ diagEl.style.display="block"; document.getElementById("diagToggle").style.display="none"; }
window.addEventListener("error", (e) => log("JS error: " + e.message + " @" + (e.filename||"").split("/").pop() + ":" + e.lineno, "d-err"));
window.addEventListener("unhandledrejection", (e) => log("Promise rejection: " + (e.reason && e.reason.message || e.reason), "d-err"));

if (typeof Cesium === "undefined") {
  document.body.insertAdjacentHTML("beforeend",
    "<div style='position:absolute;top:40%;width:100%;text-align:center;color:#ff7e7e;font-size:16px;z-index:99'>" +
    "Cesium.js failed to load from cesium.com — check your internet connection / firewall, then refresh.</div>");
  throw new Error("Cesium not loaded");
}
log("Cesium " + Cesium.VERSION + " loaded", "d-ok");

// WebGL check
(function () {
  const c = document.createElement("canvas");
  const gl = c.getContext("webgl2") || c.getContext("webgl");
  if (gl) log("WebGL available (" + (gl.getParameter ? gl.getParameter(gl.VERSION) : "?") + ")", "d-ok");
  else log("WebGL NOT available — enable hardware acceleration in your browser settings (chrome://settings/system), then restart the browser.", "d-err");
})();

Cesium.Ion.defaultAccessToken = CONFIG.ionToken;

/* ---------- Viewer ---------- */
let viewer;
try {
  viewer = new Cesium.Viewer("cesiumContainer", {
    // OSM needs no token — guarantees a visible globe. Try satellite on top.
    baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })),
    animation: false, timeline: false, baseLayerPicker: false,
    geocoder: false, sceneModePicker: false, navigationHelpButton: false,
    infoBox: false, selectionIndicator: false,
  });
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#3d4a3d"); // never black while tiles load
  viewer.scene.globe.showGroundAtmosphere = true;
  log("Viewer created (OpenStreetMap base — token-independent)", "d-ok");
} catch (e) {
  log("Viewer creation failed: " + e.message, "d-err");
  throw e;
}

// Try to add Cesium World Imagery (satellite) on top; harmless if it fails.
(async () => {
  try {
    const sat = await Cesium.createWorldImageryAsync();
    viewer.imageryLayers.addImageryProvider(sat);
    log("Satellite imagery (World Imagery) added", "d-ok");
  } catch (e) {
    log("Satellite imagery unavailable (" + e.message + ") — staying on OSM.", "d-info");
  }
})();

viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(CONFIG.lon, CONFIG.lat, 500),
  orientation: { pitch: Cesium.Math.toRadians(-50) },
  duration: 0,
});

/* ---------- Token check + terrain ---------- */
(async () => {
  try {
    const r = await fetch("https://api.cesium.com/v1/me", { headers: { Authorization: "Bearer " + CONFIG.ionToken } });
    if (r.ok) { const me = await r.json(); log("ion token valid (account: " + (me.username || me.id) + ")", "d-ok"); }
    else log("ion token REJECTED (HTTP " + r.status + ") — create a new token at ion.cesium.com → Access Tokens and paste it into CONFIG.ionToken.", "d-err");
  } catch (e) { log("Could not reach api.cesium.com: " + e.message, "d-err"); }

  // Terrain: only keep World Terrain if it demonstrably works (test-sample it);
  // otherwise stay on the flat ellipsoid so the globe ALWAYS renders.
  let groundH = 0;
  if (CONFIG.useWorldTerrain) {
    try {
      const tp = await Cesium.createWorldTerrainAsync();
      const s = await Cesium.sampleTerrainMostDetailed(tp,
        [Cesium.Cartographic.fromDegrees(CONFIG.lon, CONFIG.lat)]);
      if (s && s[0] && isFinite(s[0].height)) {
        viewer.terrainProvider = tp;
        groundH = s[0].height;
        log("World Terrain OK — ground at site: " + groundH.toFixed(2) + " m (ellipsoidal)", "d-ok");
      } else {
        log("World Terrain returned no height — using flat ellipsoid (ground = 0 m).", "d-err");
      }
    } catch (e) {
      log("World Terrain failed (" + e.message + ") — using flat ellipsoid (ground = 0 m). Likely the ion token has no access to Cesium World Terrain (asset 1).", "d-err");
    }
  }

  createSensorEntities(groundH + CONFIG.heightOffset);

  /* ---------- Tileset ---------- */
  try {
    const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(CONFIG.assetId);
    viewer.scene.primitives.add(tileset);
    const site = Cesium.Cartesian3.fromDegrees(CONFIG.lon, CONFIG.lat, groundH);
    const distM = Cesium.Cartesian3.distance(tileset.boundingSphere.center, site);
    log("Tileset " + CONFIG.assetId + " loaded — " + (distM/1000).toFixed(1) + " km from site (before placement)", "d-ok");

    if (CONFIG.placeAtSite && (!isFinite(distM) || distM > 3000)) {
      // No georeference in the tileset → anchor it in a local east-north-up
      // frame at the site, on the terrain surface (ion sample style).
      const origin = Cesium.Cartesian3.fromDegrees(CONFIG.lon, CONFIG.lat, groundH + CONFIG.heightOffset);
      const hpr = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(CONFIG.headingDegrees), 0, 0);
      tileset.modelMatrix = Cesium.Transforms.headingPitchRollToFixedFrame(origin, hpr);
      log("Placed at Kerkweg 18 site (" + CONFIG.lon + ", " + CONFIG.lat + "), heading " + CONFIG.headingDegrees + "°", "d-ok");
    } else if (CONFIG.placeAtSite) {
      log("Tileset already near the site — placement skipped (georeferenced on ion).", "d-ok");
    }

    await viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0.6, -0.4, 60));
    log("If the model floats/sinks → tune CONFIG.heightOffset; if rotated → CONFIG.headingDegrees.", "d-info");
    if (diagErrors === 0) setTimeout(hideDiag, 6000);
  } catch (e) {
    log("Tileset " + CONFIG.assetId + " failed: " + e.message + " — check the asset finished tiling on ion.cesium.com and the ID is correct.", "d-err");
  }
})();

/* ---------- Click element → BIM properties ---------- */
const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
let highlighted = null;
handler.setInputAction((movement) => {
  if (highlighted) { highlighted.color = Cesium.Color.WHITE; highlighted = null; }
  const picked = viewer.scene.pick(movement.position);
  const panel = document.getElementById("propPanel");
  const content = document.getElementById("propContent");

  if (picked instanceof Cesium.Cesium3DTileFeature) {
    picked.color = Cesium.Color.YELLOW.withAlpha(0.7);
    highlighted = picked;
    const ids = picked.getPropertyIds ? picked.getPropertyIds() : [];
    let rows = "";
    ids.sort().forEach((id) => {
      const v = picked.getProperty(id);
      if (v !== undefined && v !== null && v !== "") rows += `<tr><td>${id}</td><td>${v}</td></tr>`;
    });
    content.innerHTML = rows ? `<table class="props">${rows}</table>`
      : "No properties on this element (re-tile on ion with metadata enabled).";
    panel.style.display = "block";
  } else if (picked && picked.id && picked.id.sensorZone) {
    content.innerHTML = `<h4>${picked.id.sensorZone} — virtual sensor</h4>
      <table class="props">${zoneRows(picked.id.sensorZone)}</table>`;
    panel.style.display = "block";
  }
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

/* ---------- Mock sensor overlay ---------- */
const state = {};
CONFIG.storeys.forEach((s) => {
  state[s.name] = { temp: 20 + Math.random() * 2, co2: 500 + Math.random() * 100, energy: 0.4 + Math.random() * 0.3 };
});
function createSensorEntities(groundH) {
  CONFIG.storeys.forEach((s) => {
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(CONFIG.lon + 0.00016, CONFIG.lat, groundH + s.h + 1.5),
    point: { pixelSize: 11, color: Cesium.Color.fromCssColorString("#7ec8ff"),
             outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
             disableDepthTestDistance: Number.POSITIVE_INFINITY },
    label: { text: s.name, font: "12px sans-serif", pixelOffset: new Cesium.Cartesian2(0, -18),
             fillColor: Cesium.Color.WHITE, showBackground: true,
             backgroundColor: new Cesium.Color(0.08, 0.1, 0.14, 0.8),
             disableDepthTestDistance: Number.POSITIVE_INFINITY },
    sensorZone: s.name,
  });
  });
}

function cls(v, lo, hi) { return v < lo ? "ok" : v < hi ? "warn" : "bad"; }
function zoneRows(name) {
  const z = state[name];
  return `<tr><td>Temperature</td><td class="${cls(z.temp, 23, 26)}">${z.temp.toFixed(1)} °C</td></tr>
          <tr><td>CO₂</td><td class="${cls(z.co2, 800, 1200)}">${z.co2.toFixed(0)} ppm</td></tr>
          <tr><td>Energy</td><td>${z.energy.toFixed(2)} kW</td></tr>`;
}
function renderZones() {
  document.getElementById("zones").innerHTML = CONFIG.storeys.map((s) => {
    const z = state[s.name];
    return `<div class="zone"><div class="zname">${s.name}</div>
      <div class="metric"><span>Temp</span><span class="val ${cls(z.temp,23,26)}">${z.temp.toFixed(1)} °C</span></div>
      <div class="metric"><span>CO₂</span><span class="val ${cls(z.co2,800,1200)}">${z.co2.toFixed(0)} ppm</span></div>
      <div class="metric"><span>Energy</span><span class="val">${z.energy.toFixed(2)} kW</span></div></div>`;
  }).join("");
}
setInterval(() => {
  Object.values(state).forEach((z) => {
    z.temp = Math.min(29, Math.max(17, z.temp + (Math.random() - 0.5) * 0.4));
    z.co2 = Math.min(1500, Math.max(400, z.co2 + (Math.random() - 0.5) * 40));
    z.energy = Math.min(3, Math.max(0.1, z.energy + (Math.random() - 0.5) * 0.08));
  });
  renderZones();
}, 3000);
renderZones();
</script>
</body>
</html>
